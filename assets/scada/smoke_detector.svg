<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="40" style="fill: #eee; stroke: #999; stroke-width: 2;" />
  <circle cx="50" cy="50" r="5" style="fill: #333;" />
  <circle cx="50" cy="30" r="4" [style.fill]="val > 0 ? 'red' : '#555'" [class.active-fire]="val > 0" />
  <style>
    @keyframes blink { 0% { opacity: 0.2; } 100% { opacity: 1; } }
    .active-fire { animation: blink 0.5s infinite alternate; }
  </style>
</svg>
