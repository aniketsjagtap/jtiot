<svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tower { fill: #ddd; stroke: #999; stroke-width: 2; }
    .water { fill: #00e5ff; opacity: 0.2; animation: falling 1s infinite linear; }
    @keyframes falling { from { transform: translateY(0); } to { transform: translateY(20px); } }
  </style>
  <path d="M 20 110 L 35 20 L 65 20 L 80 110 Z" class="tower" />
  <rect x="35" y="20" width="30" height="5" fill="#555" />
  <g class="steam-group">
    <circle cx="45" cy="5" r="5" fill="white" opacity="0.2" />
    <circle cx="55" cy="0" r="7" fill="white" opacity="0.3" />
  </g>
  <rect x="25" y="80" width="50" height="20" class="water" />
</svg>
