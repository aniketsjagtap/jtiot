<svg viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .shaft { fill: #777; stroke: #555; stroke-width: 2; }
    .spinning { animation: rotate 1s linear infinite; transform-origin: 50px 180px; }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .blade { fill: #00e5ff; }
  </style>
  <rect x="45" y="10" width="10" height="170" rx="5" ry="5" class="shaft" />
  <g class="propeller-group">
    <path d="M 50 180 L 20 170 Q 20 190 50 180 M 50 180 L 80 170 Q 80 190 50 180" class="blade spinning" />
  </g>
  <rect x="30" y="5" width="40" height="30" rx="5" ry="5" fill="#333" />
</svg>
