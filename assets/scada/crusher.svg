<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .crushing { animation: vibrate 0.1s infinite alternate; }
    @keyframes vibrate { from { transform: translate(-1px, -1px); } to { transform: translate(1px, 1px); } }
    .frame { fill: #555; stroke: #333; stroke-width: 2; }
    .jaw { fill: #777; stroke: #333; stroke-width: 2; }
  </style>
  <rect x="10" y="20" width="80" height="60" class="frame" />
  <path d="M 20 30 L 40 70 L 60 30 L 80 70" class="jaw active" [class.crushing]="val > 0" style="fill:none; stroke:#333; stroke-width:4;" />
  <text x="50" y="95" text-anchor="middle" style="fill:#888; font-size:10px;">CRUSHER</text>
</svg>
