<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .running { animation: spin 1s linear infinite; transform-origin: center; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .fan-housing { fill: none; stroke: #555; stroke-width: 4; }
    .blade { fill: #00e5ff; opacity: 0.8; }
  </style>
  <circle cx="50" cy="50" r="45" class="fan-housing" />
  <g class="fan-blades">
    <path d="M 50 50 L 50 10 A 10 10 0 0 1 60 20 Z" class="blade" />
    <path d="M 50 50 L 90 50 A 10 10 0 0 1 80 60 Z" class="blade" />
    <path d="M 50 50 L 50 90 A 10 10 0 0 1 40 80 Z" class="blade" />
    <path d="M 50 50 L 10 50 A 10 10 0 0 1 20 40 Z" class="blade" />
  </g>
</svg>
