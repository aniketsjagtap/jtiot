<svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <style>
    .belt { fill: none; stroke: #333; stroke-width: 10; stroke-linecap: round; }
    .surface { fill: none; stroke: #555; stroke-width: 4; stroke-dasharray: 15 10; }
    .active { animation: move 1s linear infinite; }
    @keyframes move { from { stroke-dashoffset: 25; } to { stroke-dashoffset: 0; } }
    .roller { fill: #111; }
  </style>
  <rect x="15" y="15" width="170" height="30" rx="15" ry="15" class="belt" />
  <rect x="15" y="15" width="170" height="30" rx="15" ry="15" class="surface active" />
  <circle cx="30" cy="30" r="12" class="roller" />
  <circle cx="170" cy="30" r="12" class="roller" />
</svg>
