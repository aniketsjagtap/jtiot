<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .panel { fill: #1a237e; stroke: #333; stroke-width: 2; }
    .grid { stroke: rgba(255,255,255,0.2); stroke-width: 1; }
    .glimmer { fill: white; opacity: 0.1; }
  </style>
  <rect x="10" y="20" width="80" height="60" rx="5" class="panel" transform="skewX(-10)" />
  <line x1="10" y1="40" x2="90" y2="40" class="grid" />
  <line x1="10" y1="60" x2="90" y2="60" class="grid" />
  <line x1="36" y1="20" x2="36" y2="80" class="grid" />
  <line x1="63" y1="20" x2="63" y2="80" class="grid" />
  <rect x="15" y="25" width="20" height="10" class="glimmer" />
</svg>
