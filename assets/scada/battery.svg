<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bat-body { fill: #333; stroke: #555; stroke-width: 3; }
    .level { fill: #00e5ff; transition: height 0.5s ease; }
    .charging { animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
  </style>
  <rect x="20" y="20" width="60" height="70" rx="5" class="bat-body" />
  <rect x="40" y="10" width="20" height="10" rx="2" class="bat-body" />
  <rect id="bat-level" x="25" y="85" width="50" height="0" rx="2" class="level" />
</svg>
