<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .water-spray { fill: #00e5ff; opacity: 0.4; animation: spray 1s infinite linear; }
    @keyframes spray { from { transform: scale(0); opacity: 0.4; } to { transform: scale(1.5); opacity: 0; } }
  </style>
  <rect x="45" y="60" width="10" height="40" fill="#555" />
  <circle cx="50" cy="50" r="10" fill="#333" />
  <g class="spray-group active">
    <circle cx="50" cy="30" r="5" class="water-spray" />
    <circle cx="30" cy="40" r="5" class="water-spray" transform="rotate(-45, 50, 50)" />
    <circle cx="70" cy="40" r="5" class="water-spray" transform="rotate(45, 50, 50)" />
  </g>
</svg>
