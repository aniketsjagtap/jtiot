<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .motor-body { fill: #333; stroke: #555; stroke-width: 2; }
    .running { animation: fanSpin 1s linear infinite; transform-origin: 20px 50px; }
    @keyframes fanSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .fan { fill: #00e5ff; }
  </style>
  <rect x="30" y="20" width="60" height="60" rx="10" ry="10" class="motor-body" />
  <rect x="90" y="45" width="10" height="10" rx="2" ry="2" fill="#555" />
  <circle cx="20" cy="50" r="15" fill="#222" stroke="#555" stroke-width="2" />
  <g class="fan-group running">
    <path d="M 20 50 L 20 35 M 20 50 L 35 50 M 20 50 L 20 65 M 20 50 L 5 50" stroke="#00e5ff" stroke-width="4" stroke-linecap="round" class="fan" />
  </g>
</svg>
